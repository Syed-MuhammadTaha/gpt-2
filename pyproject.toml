[project]
name = "gpt-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syed-MuhammadTaha", email = "simam.bscs22seecs@seecs.edu.pk" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
gpt-2 = "gpt_2:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
